name: Build and publish main

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and publish even when main has not moved"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  BUCKET: web-app-next
  SITE_URL: https://next.vectorcraft.cloud/

jobs:
  # Reads main's head and the bucket's STATE. Runs no VectorCraft code.
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Find main's head
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/storytold/vectorcraft/commits/main --jq .sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected sha: $sha" >&2; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Compare with the published build
        id: compare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ steps.main.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          state=$(scripts/current.sh "$BUCKET")
          current=$(printf '%s\n' "$state" | sed -n 's/^current=//p')
          checked=$(printf '%s\n' "$state" | sed -n 's/^checked=//p')
          failed=$(printf '%s\n' "$state" | sed -n 's/^failed=//p')
          short=${SHA:0:12}
          # A build id is <first 12 characters of the commit>.<UTC time>.
          published=$(printf '%s' "$current" | sed -E 's/\.[0-9]{14}$//')
          failed_sha=$(printf '%s' "$failed" | sed -E 's/\.[0-9]{14}$//')
          echo "published: ${current:-nothing} (checked: ${checked:-nothing}, failed: ${failed:-nothing}), main: $short"
          if [[ -n $current && $published == "$short" && $checked == "$current" && $FORCE != true ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          elif [[ -n $current && $checked == "$current" && $failed_sha == "$short" && $FORCE != true ]]; then
            # This commit already failed its check; the checked build stays live until main moves,
            # or a run by hand with force.
            echo "::warning::$short failed its check as build $failed; not publishing it again"
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

  # Builds the web zip from main. This job runs VectorCraft's build code, so it gets no Cloudflare
  # secret; its only output is the zip artifact. The steps follow the web job of
  # storytold/craft-common-actions .github/workflows/release.yml.
  build:
    needs: compare
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      # A private repository's standard runner has 7 GB of memory, less than compiling the engine
      # crate takes; a swap file keeps the compiler from being killed.
      - name: Add swap
        run: |
          set -euo pipefail
          free -g
          df -h /
          # The runner image carries toolchains this build does not use; removing them frees disk for
          # the swap file and the build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
          # Up to 16 GiB, leaving 20 GiB of the free space on / for the checkout and the build.
          free_gib=$(( $(df --output=avail -B1 / | tail -n 1 | tr -dc '0-9') / 1073741824 ))
          size=$((free_gib - 20))
          if [[ $size -gt 16 ]]; then size=16; fi
          if [[ $size -lt 2 ]]; then
            echo "::warning::only ${free_gib} GiB free on /; building without extra swap"
            exit 0
          fi
          sudo fallocate -l "${size}G" /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          free -g
      - name: Check out VectorCraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/vectorcraft
          ref: ${{ needs.compare.outputs.sha }}
          persist-credentials: false
      # The contributor credits (About window) come from contributors/contributors.json as committed
      # at this commit. The release workflow refreshes that file first, but its script makes GraphQL
      # queries of storytold/vectorcraft, which this repository's GITHUB_TOKEN may not make.
      - name: Read the craft-fonts pin
        id: fonts
        run: |
          ref=$(grep -oE 'craft-fonts-ref:[[:space:]]*[0-9a-f]{40}' .github/workflows/release.yml | grep -oE '[0-9a-f]{40}' | head -n 1)
          [[ -n $ref ]] || { echo "no craft-fonts-ref in release.yml" >&2; exit 1; }
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@main
        with:
          targets: wasm32-unknown-unknown
      # rustup is on GitHub's runners; the release workflow's toolchain action is free only for public
      # repositories.
      - name: Install the toolchain
        env:
          TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
          TARGETS: ${{ steps.rust.outputs.targets }}
          COMPONENTS: ${{ steps.rust.outputs.components }}
        run: |
          set -euo pipefail
          [[ $TOOLCHAIN =~ ^[A-Za-z0-9._-]+$ ]] || { echo "unexpected toolchain: $TOOLCHAIN" >&2; exit 1; }
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          IFS=, read -ra targets <<<"$TARGETS"
          for t in "${targets[@]}"; do [[ -z $t ]] || rustup target add --toolchain "$TOOLCHAIN" "$t"; done
          IFS=, read -ra components <<<"$COMPONENTS"
          for c in "${components[@]}"; do [[ -z $c ]] || rustup component add --toolchain "$TOOLCHAIN" "$c"; done
          rustup default "$TOOLCHAIN"
          rustc --version --verbose
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: next-web
      - uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ steps.fonts.outputs.ref }}
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Build and zip
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - name: Find the zip
        id: zip
        run: |
          zips=(dist/release/vectorcraft-web-*.zip)
          [[ ${#zips[@]} -eq 1 && -f ${zips[0]} ]] || { echo "expected one web zip in dist/release" >&2; exit 1; }
          echo "path=${zips[0]}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-zip
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 3

  # Uploads the zip to the bucket. Runs only this repository's scripts; the zip is treated as data.
  publish:
    needs: [compare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHA: ${{ needs.compare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Decide again on the current STATE
        # "Re-run failed jobs" reuses the compare and build jobs' results, so this step repeats the
        # compare job's decision on the STATE and main head of now. It publishes when this run's
        # commit is main's head (also after upstream rewrites main) or is newer than the published
        # build, and not when that commit is already served and checked or already failed its check
        # (unless force is set).
        id: fresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          state=$(scripts/current.sh "$BUCKET")
          current=$(printf '%s\n' "$state" | sed -n 's/^current=//p')
          checked=$(printf '%s\n' "$state" | sed -n 's/^checked=//p')
          failed=$(printf '%s\n' "$state" | sed -n 's/^failed=//p')
          published=$(printf '%s' "$current" | sed -E 's/\.[0-9]{14}$//')
          failed_sha=$(printf '%s' "$failed" | sed -E 's/\.[0-9]{14}$//')
          short=${SHA:0:12}
          head=$(gh api repos/storytold/vectorcraft/commits/main --jq .sha)
          publish=true
          if [[ $FORCE != true && -n $current && $checked == "$current" ]]; then
            if [[ $published == "$short" ]]; then
              echo "::notice::$short is already served and checked; not publishing"
              publish=false
            elif [[ $failed_sha == "$short" ]]; then
              echo "::warning::$short failed its check as build $failed; not publishing it again"
              publish=false
            fi
          fi
          if [[ $publish == true && $SHA != "$head" ]]; then
            # An older commit is published only while it is still on main and newer than the build
            # being served.
            on_main=$(gh api "repos/storytold/vectorcraft/compare/$SHA...$head" --jq .status)
            echo "this run $SHA, main $head: $on_main"
            if [[ $on_main != ahead ]]; then
              echo "::notice::$SHA is no longer on main; not publishing"
              publish=false
            elif [[ $published == "$short" ]]; then
              echo "::notice::$short is served already and is not main's head; not publishing it again"
              publish=false
            elif [[ -n $published ]]; then
              [[ $published =~ ^[0-9a-f]{12}$ ]] || { echo "unexpected published id: $current" >&2; exit 1; }
              status=$(gh api "repos/storytold/vectorcraft/compare/$published...$SHA" --jq .status)
              echo "published $published, this run $SHA: $status"
              if [[ $status != ahead ]]; then
                echo "::notice::$SHA is not newer than the published $published; not publishing"
                publish=false
              fi
            fi
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.fresh.outputs.publish == 'true'
        with:
          name: web-zip
          path: dl
      - name: Unpack the zip
        if: steps.fresh.outputs.publish == 'true'
        id: site
        run: |
          zips=(dl/vectorcraft-web-*.zip)
          [[ ${#zips[@]} -eq 1 && -f ${zips[0]} ]] || { echo "expected one web zip in the artifact" >&2; exit 1; }
          dir=$(scripts/unpack.sh "${zips[0]}" "$RUNNER_TEMP/unpacked")
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
      # The step limits (20 + 12 minutes) leave the rollback time to run inside the job's 45.
      - name: Publish
        if: steps.fresh.outputs.publish == 'true'
        id: publish
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIR: ${{ steps.site.outputs.dir }}
        run: scripts/publish.sh "$BUCKET" "${SHA:0:12}" "$DIR"
      - name: Check the site
        id: check
        if: steps.publish.outputs.id != ''
        timeout-minutes: 12
        env:
          ID: ${{ steps.publish.outputs.id }}
        # An inconclusive check (the runner could not reach the site, for example Cloudflare answering
        # 403 to a datacenter address) lets the build go through: publish.sh has already checked its
        # files. Only a check that shows the build is wrong fails this step and rolls back.
        run: |
          set +e
          scripts/check.sh "$SITE_URL" "$ID"
          code=$?
          if [[ $code == 3 ]]; then
            echo "::warning::the site check could not reach $SITE_URL from the runner; build $ID stays live"
            exit 0
          fi
          exit $code
      - name: Record the check
        if: steps.publish.outputs.id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ID: ${{ steps.publish.outputs.id }}
        run: scripts/mark-checked.sh "$BUCKET" "$ID"
      # Only a failed or canceled site check rolls back; a failure to record a passed check leaves
      # the build live and unchecked, and the next run checks it again.
      - name: Roll back a build that fails its check
        if: always() && steps.publish.outputs.id != '' && steps.check.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ID: ${{ steps.publish.outputs.id }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        # A check that found the build wrong marks the commit as failed; an inconclusive, canceled
        # or skipped check does not, so the next run tries the commit again.
        run: |
          if [[ $VERDICT == bad ]]; then
            scripts/rollback.sh "$BUCKET" "$ID"
          else
            scripts/rollback.sh --canceled "$BUCKET" "$ID"
          fi
      - name: Delete old builds
        if: always() && steps.fresh.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/cleanup.sh "$BUCKET"

  # On runs that build nothing, retries the deletions an earlier run could not finish.
  cleanup:
    needs: compare
    if: needs.compare.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Delete old builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/cleanup.sh "$BUCKET"
